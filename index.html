<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>GST & 歩合計算機 + Chinami Invoice (multi)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: #f5f5fb;
      color: #222;
    }
    .container {
      max-width: 420px;
      margin: 0 auto;
      background: #fff;
      border-radius: 18px;
      padding: 24px 18px 28px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }
    h1 {
      text-align: center;
      margin: 4px 0 20px;
      font-size: 26px;
      letter-spacing: 0.04em;
    }
    label {
      display: block;
      font-weight: 600;
      margin: 14px 4px 4px;
      font-size: 14px;
    }
    input, select, button {
      width: 100%;
      font-size: 16px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #d0d4e0;
      outline: none;
      font-family: inherit;
    }
    input:focus, select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.18);
    }
    button {
      margin-top: 18px;
      background: #0c61d9;
      color: #fff;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      opacity: 0.95;
    }
    .result-card {
      margin-top: 18px;
      padding: 18px 14px 16px;
      border-radius: 12px;
      background: #e8f9f1;
      border: 1px solid #b7e4d0;
      font-size: 15px;
    }
    .result-row {
      margin: 5px 0;
    }
    .result-label {
      font-weight: 700;
    }
    .small-note {
      margin-top: 6px;
      font-size: 12px;
      color: #555;
    }
    .sub-btn {
      margin-top: 10px;
      background: #10b981;
    }
    .invoice-card {
      margin-top: 14px;
      padding: 16px 14px 14px;
      border-radius: 12px;
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      font-size: 14px;
    }
    .invoice-item-row {
      display: flex;
      justify-content: space-between;
      margin: 4px 0;
      font-size: 13px;
    }
    .invoice-item-label {
      max-width: 70%;
    }
    .invoice-item-value {
      font-variant-numeric: tabular-nums;
    }
    .invoice-total {
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px dashed #a5b4fc;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
    }
    .invoice-total-line {
      display: flex;
      justify-content: space-between;
      margin-top: 2px;
      font-weight: 600;
    }
    .invoice-btn {
      margin-top: 10px;
      background: #4f46e5;
    }
    .invoice-empty {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>GST & 歩合計算機</h1>

    <!-- 日付（売上日 / 請求日） -->
    <label for="invoiceDate">日付（売上日 / 請求日）:</label>
    <input id="invoiceDate" type="date" />

    <label for="amount">金額 (GST込み):</label>
    <input id="amount" type="number" inputmode="decimal" placeholder="例: 1000" />

    <label for="category">カテゴリを選択:</label>
    <select id="category">
      <option value="">選択してください</option>
      <option value="0.40">サービス売上 (40%)</option>
      <option value="0.3">Mao (30%)</option>
      <option value="0.20">コンテンツモデル (20%)</option>
      <option value="0.10">物販売上 (10%)</option>
    </select>

    <button onclick="calculate()">計算する</button>

    <div id="result" class="result-card" style="display:none;">
      <div class="result-row">
        <span class="result-label">GST抜き金額:</span>
        <span id="gstExclusiveDisplay"></span>
      </div>
      <div class="result-row">
        <span class="result-label">GST:</span>
        <span id="gstDisplay"></span>
      </div>
      <div class="result-row">
        <span class="result-label">歩合率:</span>
        <span id="rateDisplay"></span>
      </div>
      <div class="result-row">
        <span class="result-label">歩合金額:</span>
        <span id="commissionDisplay"></span>
      </div>
      <p class="small-note">
        ※ 計算: GST抜き = 金額 ÷ 1.15、歩合金額 = GST抜き × 歩合率
      </p>

      <!-- この計算結果を請求書に追加 -->
      <button class="sub-btn" onclick="addCurrentToInvoice()">
        この売上を請求書に追加
      </button>
      <p class="small-note">
        例）サービス 1000、物販 100、モデル 200 をそれぞれ計算して「請求書に追加」を押すと、<br>
        1枚の請求書にまとめて出力できます。
      </p>
    </div>

    <!-- 請求書に追加された項目一覧 -->
    <div id="invoiceCard" class="invoice-card" style="display:none;">
      <div style="font-weight:600; margin-bottom:4px;">請求書に追加された売上</div>
      <div id="invoiceSummaryList"></div>
      <div id="invoiceTotals" class="invoice-total" style="display:none;"></div>
      <button class="invoice-btn" onclick="openInvoiceForChinami()">
        チナミさん請求書を作成（PDF用）
      </button>
      <div class="invoice-empty" id="invoiceEmptyMsg" style="display:none;">
        まだ項目がありません。「計算する」→「この売上を請求書に追加」を押してください。
      </div>
    </div>
  </div>

  <script>
    let lastResult = null;        // 直近の計算結果
    let invoiceItems = [];        // 請求書に含める全項目

    function calculate() {
      const amountInput = document.getElementById('amount');
      const categorySelect = document.getElementById('category');
      const amount = parseFloat(amountInput.value);
      const rate = parseFloat(categorySelect.value);

      if (isNaN(amount) || isNaN(rate)) {
        alert('金額とカテゴリを正しく入力・選択してください。');
        return;
      }

      const gstExclusive = amount / 1.15;
      const gst = amount - gstExclusive;
      const commissionAmount = gstExclusive * rate;

      document.getElementById('gstExclusiveDisplay').textContent =
        '$' + gstExclusive.toFixed(2);
      document.getElementById('gstDisplay').textContent =
        '$' + gst.toFixed(2);
      document.getElementById('rateDisplay').textContent =
        (rate * 100).toFixed(0) + '%';
      document.getElementById('commissionDisplay').textContent =
        '$' + commissionAmount.toFixed(2);

      document.getElementById('result').style.display = 'block';

      // 請求書用に保存（1件分）
      lastResult = {
        gross: amount,
        gstExclusive: gstExclusive,
        gst: gst,
        rate: rate,
        commissionAmount: commissionAmount,
      };
    }

    function getDescriptionForRate(rate) {
      // rate によって説明文を変える
      if (Math.abs(rate - 0.40) < 0.0001) {
        return 'Hairdressing services (Service 40%)';
      } else if (Math.abs(rate - 0.20) < 0.0001) {
        return 'Model / Content services (20%)';
      } else if (Math.abs(rate - 0.10) < 0.0001) {
        return 'Retail product sales (10%)';
      } else {
        return 'Services';
      }
    }

    function addCurrentToInvoice() {
      if (!lastResult) {
        alert('先に「計算する」を押してください。');
        return;
      }

      const desc = getDescriptionForRate(lastResult.rate);

      invoiceItems.push({
        description: desc,
        gross: lastResult.gross,
        gstExclusive: lastResult.gstExclusive,
        rate: lastResult.rate,
        commissionAmount: lastResult.commissionAmount
      });

      updateInvoiceSummary();
    }

    function updateInvoiceSummary() {
      const card = document.getElementById('invoiceCard');
      const list = document.getElementById('invoiceSummaryList');
      const totalsDiv = document.getElementById('invoiceTotals');
      const emptyMsg = document.getElementById('invoiceEmptyMsg');

      card.style.display = 'block';

      if (invoiceItems.length === 0) {
        list.innerHTML = '';
        totalsDiv.style.display = 'none';
        emptyMsg.style.display = 'block';
        return;
      }

      emptyMsg.style.display = 'none';

      let html = '';
      let totalGross = 0;
      let totalCommission = 0;

      invoiceItems.forEach(function (item, index) {
        totalGross += item.gross;
        totalCommission += item.commissionAmount;

        html += `
          <div class="invoice-item-row">
            <div class="invoice-item-label">
              ${index + 1}. ${item.description}<br>
              <span style="font-size:11px; color:#555;">
                売上 $${item.gross.toFixed(2)} / 1.15 = $${item.gstExclusive.toFixed(2)} (excl) × ${(item.rate * 100).toFixed(0)}%
              </span>
            </div>
            <div class="invoice-item-value">
              $${item.commissionAmount.toFixed(2)}
            </div>
          </div>
        `;
      });

      list.innerHTML = html;

      totalsDiv.innerHTML = `
        <div class="invoice-total-line">
          <span>合計売上 (GST込み)</span>
          <span>$${totalGross.toFixed(2)}</span>
        </div>
        <div class="invoice-total-line">
          <span>合計コミッション</span>
          <span>$${totalCommission.toFixed(2)}</span>
        </div>
      `;

      totalsDiv.style.display = 'block';
    }

    function formatDateForInvoice(date) {
      const day = date.getDate();
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const month = months[date.getMonth()];
      const year = date.getFullYear();
      return day + ' ' + month + ' ' + year; // 19 Oct 2025 形式
    }

    // 入力された日付（なければ今日）を "19 Oct 2025" 形式で返す
    function getInvoiceDateStr() {
      const input = document.getElementById('invoiceDate');
      const value = input ? input.value : '';

      if (!value) {
        // 何も入力されていない場合は「今日」を使う
        return formatDateForInvoice(new Date());
      }

      // value は "2025-10-19" のような形式
      const parts = value.split('-'); // [YYYY, MM, DD]
      if (parts.length !== 3) {
        return formatDateForInvoice(new Date());
      }

      const year = parseInt(parts[0], 10);
      const month = parseInt(parts[1], 10) - 1; // JSは 0=Jan
      const day = parseInt(parts[2], 10);

      const d = new Date(year, month, day);
      if (isNaN(d.getTime())) {
        return formatDateForInvoice(new Date());
      }
      return formatDateForInvoice(d);
    }

    function openInvoiceForChinami() {
      if (!invoiceItems || invoiceItems.length === 0) {
        alert('請求書に追加された項目がありません。');
        return;
      }

      const dateStr = getInvoiceDateStr();

      let totalGross = 0;
      let totalCommission = 0;

      invoiceItems.forEach(function (item) {
        totalGross += item.gross;
        totalCommission += item.commissionAmount;
      });

      const rowsHtml = invoiceItems.map(function (item) {
        return `
          <tr>
            <td>${dateStr}</td>
            <td>${item.description}</td>
            <td class="num">$${item.gross.toFixed(2)} incl</td>
            <td class="num">${(item.rate * 100).toFixed(0)}%</td>
            <td class="num">$${item.commissionAmount.toFixed(2)}</td>
          </tr>
          <tr>
            <td></td>
            <td colspan="4" style="color:#555;">
              Calc: $${item.gross.toFixed(2)} / 1.15 = $${item.gstExclusive.toFixed(2)} (excl),
              commission ${(item.rate * 100).toFixed(0)}% = $${item.commissionAmount.toFixed(2)}
            </td>
          </tr>
        `;
      }).join('');

      const win = window.open('', '_blank');

      win.document.write(`
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Invoice - Chinami Imabeppu (${dateStr})</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin:24px; color:#222; }
  .wrap { max-width:860px; margin:0 auto; }
  h1 { margin:0 0 8px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:10px; }
  .box { border:1px solid #ddd; border-radius:10px; padding:12px; }
  table { width:100%; border-collapse:collapse; margin-top:16px; }
  th, td { border-bottom:1px solid #eee; padding:10px; text-align:left; font-size:15px; }
  th { background:#f7f7f9; }
  .num { text-align:right; font-variant-numeric: tabular-nums; }
  tfoot td { font-weight:700; }
  .total { font-size:18px; font-weight:700; margin-top:14px; }
  .note { margin-top:6px; color:#444; }
</style>
</head>
<body>
<div class="wrap">
  <h1>INVOICE</h1>
  <div>Invoice Date: <b>${dateStr}</b></div>

  <div class="grid">
    <div class="box">
      <div><b>From:</b></div>
      <div>Chinami Imabeppu</div>
      <div>18C Otanerua Road, Hatfield Beach, Orewa 0931</div>
      <div>Bank: 06-0513-0835329-01 (CHINAMI IMABEPPU)</div>
    </div>
    <div class="box">
      <div><b>To:</b></div>
      <div>YKTL ALL STAR Limited t/a Yusukay Hair Studio</div>
      <div>136 Kitchener Road, Milford, Auckland 0620</div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width:110px;">Date</th>
        <th>Description of Services</th>
        <th class="num" style="width:160px;">Total Sales (GST incl.)</th>
        <th class="num" style="width:80px;">Rate</th>
        <th class="num" style="width:160px;">Commission Payable</th>
      </tr>
    </thead>
    <tbody>
      ${rowsHtml}
    </tbody>
    <tfoot>
      <tr>
        <td></td>
        <td class="num">Total</td>
        <td class="num">$${totalGross.toFixed(2)}</td>
        <td></td>
        <td class="num">$${totalCommission.toFixed(2)}</td>
      </tr>
    </tfoot>
  </table>

  <div class="total">TOTAL DUE: $${totalCommission.toFixed(2)}</div>
  <div class="note">GST not registered. Please make payment within 7 days to the bank account listed above.</div>
  <div class="note">Commission is calculated on GST-exclusive sales (Total / 1.15 × 各歩合率) for each line item.</div>
</div>

<script>
  window.print();
<\/script>
</body>
</html>
      `);

      win.document.close();
    }
  </script>
</body>
</html>
